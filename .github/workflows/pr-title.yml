name: pr-title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # No `with:` block on purpose — that is the strict configuration. Types
      # default to the conventional-commit set and scopes stay unrestricted;
      # a `scopes:` allowlist would have to carry `main` or release-please's
      # own `chore(main): release jigs libraries` would fail this check.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
