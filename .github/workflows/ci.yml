name: CI

on: pull_request

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The only job that compiles a workflow directive — see
  # e2e/check-step-ids.mjs for why nothing else can.
  step-ids:
    runs-on: ubuntu-latest
    # The boot half of the check starts the built service, whose registry gate
    # creates its tables in this database (CREATE TABLE IF NOT EXISTS, so a
    # fresh one needs no bootstrap). The World itself is a stub; only the
    # registry touches Postgres. Without the URL the check skips the boot.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jigs
          POSTGRES_PASSWORD: jigs
          POSTGRES_DB: jigs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jigs -d jigs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `jigs init` and `jigs build` run from the CLI's dist, so the CLI has to
      # exist as the built artifact its bin entry points at.
      - run: pnpm build
      # The built service will not start unless both CLIs are on its PATH.
      # Unpinned: the check reads the minimum codex version from the provider.
      # No login needed — the check only runs `--version`.
      - run: npm install --global @anthropic-ai/claude-code @openai/codex
      - run: pnpm e2e
        env:
          WORKFLOW_POSTGRES_URL: postgres://jigs:jigs@localhost:5432/jigs
