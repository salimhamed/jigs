name: release

on:
  push:
    branches: [main]
  # Preview releases from the hub branch; the `preview` job below.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Main pushes queue instead of racing release-please. Previews queue apart:
# a run waiting in a group replaces the one already waiting there, so sharing
# the group could drop a pending main run.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # Root-package releases expose the unprefixed tag output.
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PAT, not GITHUB_TOKEN, in both steps below: events raised by
      # GITHUB_TOKEN start no workflow run. With it, the release PR would get
      # no checks to watch, and the squash back onto main would not re-run
      # this workflow — so no tags and no Releases would ever be cut.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Required checks in the default-branch ruleset gate the PR head.
      # GitHub waits and merges.
      # Not gated on the action's prs_created output: that is false when the
      # release PR already existed unchanged, which is exactly the state a
      # failed earlier run leaves behind — the PR would sit unmerged until an
      # unrelated release-worthy commit updated it. Looking the PR up by its
      # well-known head branch makes every run a chance to finish the job.
      - name: Enable auto-merge for the release PR
        env:
          # `gh` reads the repository from `--repo`, then `GH_REPO`, then the
          # working directory's git remote — never from GITHUB_REPOSITORY. The
          # action above talks to the API and checks nothing out, so without
          # this every `gh` call below aborts on "not a git repository".
          GH_REPO: ${{ github.repository }}
          # The eventual merge must trigger release-please on main.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head release-please--branches--main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "no open release PR — nothing to merge"
            exit 0
          fi
          echo "release PR: #$pr"

          gh pr merge "$pr" --auto --squash --delete-branch

  # Only the run that cut the Releases publishes — the one the release PR's
  # squash triggered. Every other push to main leaves releases_created unset.
  publish:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    # npm trusted publishing: the registry trusts this workflow's OIDC token,
    # so no npm token is stored anywhere, and it attaches provenance.
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag, not the triggering push: release-please reads main over the
      # API, so the run that cuts a tag can be checked out at an older commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The API reference ships in the package but is not committed; generating
      # it from the tag stamps the published version.
      - run: pnpm run docs
      # Trusted publishing needs npm 11.5.1 or later, and the npm CLI rather
      # than pnpm publish, which the npm docs do not list as supported.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm -v)"; then
            npm install -g npm@11
          fi
          npm -v
      # The workspace root shares the version but never publishes; packages/hub
      # and packages/jigs are the packages npm trusts this workflow to publish.
      # The hub goes first, as its publisher is the newer one: if it fails, no
      # jigs release lands without its matching hub, and a re-run finishes both.
      - name: Publish to npm
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          for dir in packages/hub packages/jigs; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if [ "$TAG" != "jigs-v$version" ]; then
              echo "checked out $name@$version but release-please tagged '$TAG'" >&2
              exit 1
            fi
            # A version already on the registry is a re-run of this job, not a
            # failure: the registry refuses to publish over it, so skip it.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published — skipping"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done

  # Publishes @jigs-ai/jigs and @jigs-ai/hub from the hub branch as
  # X.(Y+1).0-hub.N under the `hub` dist-tag, never `latest`. The version is
  # set in this checkout only and never committed.
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse any ref but hub
        if: ${{ github.ref != 'refs/heads/hub' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "previews publish from the hub branch only, not $REF" >&2
          exit 1
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set the preview version
        run: |
          set -euo pipefail
          IFS=. read -r major minor _ < <(node -p "require('./packages/jigs/package.json').version")
          prefix="$major.$((minor + 1)).0-hub."
          # Past both packages' previews, so every run publishes a fresh,
          # matching pair; a partial failure just burns a number. Before the
          # hub's first publish, npm has no versions of it.
          jigs="$(npm view @jigs-ai/jigs versions --json)"
          hub="$(npm view @jigs-ai/hub versions --json 2>/dev/null)" || hub='[]'
          n="$(JIGS="$jigs" HUB="$hub" PREFIX="$prefix" node -e '
            const { JIGS, HUB, PREFIX } = process.env;
            const ns = [JIGS, HUB]
              .flatMap((list) => [].concat(JSON.parse(list)))
              .filter((v) => v.startsWith(PREFIX))
              .map((v) => Number(v.slice(PREFIX.length)))
              .filter(Number.isInteger);
            console.log(ns.length ? Math.max(...ns) + 1 : 0);
          ')"
          version="$prefix$n"
          for dir in packages/jigs packages/hub; do
            (cd "$dir" && npm pkg set version="$version")
          done
          echo "preview version: $version"
      - run: pnpm build
      - run: pnpm run docs
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm -v)"; then
            npm install -g npm@11
          fi
          npm -v
      - name: Publish to npm
        run: |
          set -euo pipefail
          for dir in packages/hub packages/jigs; do
            (cd "$dir" && npm publish --tag hub --access public)
          done
