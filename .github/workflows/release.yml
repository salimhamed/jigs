name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # For the publish job: GITHUB_TOKEN writes this repo's GitHub Packages.
  packages: write
  # For GITHUB_TOKEN's read of the release PR's check rollup below. `gh pr
  # checks` also resolves each check's workflowRun over GraphQL, which is an
  # Actions read — without it every node in the reply errors and the poll
  # never sees a name.
  checks: read
  statuses: read
  actions: read

# A fixed group, so two pushes landing close together queue instead of racing
# release-please, which decides from GitHub's state rather than the checkout.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # Prefixed by the component's path: the action only drops the prefix for
      # a root component, and this manifest has one package at packages/jigs.
      tag_name: ${{ steps.release.outputs['packages/jigs--tag_name'] }}
    steps:
      # A PAT, not GITHUB_TOKEN, in both steps below: events raised by
      # GITHUB_TOKEN start no workflow run. With it, the release PR would get
      # no checks to watch, and the squash back onto main would not re-run
      # this workflow — so no tags and no Releases would ever be cut.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # `gh pr merge --auto` needs branch protection: GitHub only offers
      # auto-merge on a PR that cannot merge immediately, and this one always
      # can. Watching the checks by hand is the same wait, spelled out.
      # Not gated on the action's prs_created output: that is false when the
      # release PR already existed unchanged, which is exactly the state a
      # failed earlier run leaves behind — the PR would sit unmerged until an
      # unrelated release-worthy commit updated it. Looking the PR up by its
      # well-known head branch makes every run a chance to finish the job.
      - name: Merge the release PR
        env:
          # `gh` reads the repository from `--repo`, then `GH_REPO`, then the
          # working directory's git remote — never from GITHUB_REPOSITORY. The
          # action above talks to the API and checks nothing out, so without
          # this every `gh` call below aborts on "not a git repository".
          GH_REPO: ${{ github.repository }}
          # Reads use GITHUB_TOKEN: the fine-grained PAT cannot read
          # statusCheckRollup without a Checks grant, and a read triggers
          # nothing, so the anti-loop rule costs nothing here. Only the merge
          # itself needs the PAT (its push must re-run this workflow).
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Every check run the release PR must pass, as GitHub names them
          # (a job id in .github/workflows/). A job added there and not here
          # is a check this step can merge past.
          EXPECTED_CHECKS: ci step-ids pr-title
        run: |
          set -euo pipefail
          pr="$(gh pr list --head release-please--branches--main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "no open release PR — nothing to merge"
            exit 0
          fi
          echo "release PR: #$pr"

          # `--watch` waits only on the checks already in the rollup, and check
          # runs enter it as their workflow runs are created rather than all at
          # once — a rollup holding pr-title alone reads as green. So wait for
          # every expected run to register first, which also covers the empty
          # rollup `gh pr checks` fails outright on.
          missing="?"
          for _ in $(seq 30); do
            registered="$(gh pr checks "$pr" --json name --jq '.[].name' || true)"
            missing=""
            for want in $EXPECTED_CHECKS; do
              grep -qxF "$want" <<<"$registered" || missing="$missing $want"
            done
            [ -n "$missing" ] || break
            echo "waiting for check run(s):$missing"
            sleep 10
          done
          if [ -n "$missing" ]; then
            echo "check run(s) never registered:$missing" >&2
            exit 1
          fi

          gh pr checks "$pr" --watch --fail-fast --interval 15

          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$pr" --squash --delete-branch

  # Only the run that cut the Releases publishes — the one the release PR's
  # squash triggered. Every other push to main leaves releases_created unset.
  publish:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The tag, not the triggering push: release-please reads main over the
      # API, so the run that cuts a tag can be checked out at an older commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          # Writes //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} into
          # the runner's npmrc; publishConfig.registry in each package.json
          # names the same host.
          registry-url: https://npm.pkg.github.com
          scope: "@salimhamed"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to GitHub Packages
        env:
          # GITHUB_TOKEN, not the PAT: a publish raises no workflow event this
          # design waits on, and `packages: write` above is exactly the grant.
          # No provenance flag either — attestations exist only on npmjs.
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A version already on the registry is a re-run of this job, not a
          # failure: the registry refuses to publish over it, so skip it.
          # --no-git-checks: the checkout is detached at the squash commit,
          # which pnpm otherwise refuses as "not on a branch".
          name="$(node -p "require('./packages/jigs/package.json').name")"
          version="$(node -p "require('./packages/jigs/package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — skipping"
          else
            pnpm --filter "$name" publish --no-git-checks --access restricted
          fi

      - name: Verify the released version reached the registry
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./packages/jigs/package.json').name")"
          version="$(node -p "require('./packages/jigs/package.json').version")"
          if [ "$TAG" != "jigs-v$version" ]; then
            echo "checked out $version but release-please tagged '$TAG'" >&2
            exit 1
          fi
          npm view "$name@$version" version
