name: release

on:
  push:
    branches: [main, release-please--branches--main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # For the publish job: GITHUB_TOKEN writes this repo's GitHub Packages.
  packages: write

# Main pushes share a group, so they queue instead of racing release-please.
# The release branch uses its own group so generated docs can be committed
# independently of release-please updating the PR.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # Root-package releases expose the unprefixed tag output.
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PAT, not GITHUB_TOKEN, in both steps below: events raised by
      # GITHUB_TOKEN start no workflow run. With it, the release PR would get
      # no checks to watch, and the squash back onto main would not re-run
      # this workflow — so no tags and no Releases would ever be cut.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Required checks in the default-branch ruleset gate the current PR
      # head, including a later generated-docs commit. GitHub waits and merges.
      # Not gated on the action's prs_created output: that is false when the
      # release PR already existed unchanged, which is exactly the state a
      # failed earlier run leaves behind — the PR would sit unmerged until an
      # unrelated release-worthy commit updated it. Looking the PR up by its
      # well-known head branch makes every run a chance to finish the job.
      - name: Enable auto-merge for the release PR
        env:
          # `gh` reads the repository from `--repo`, then `GH_REPO`, then the
          # working directory's git remote — never from GITHUB_REPOSITORY. The
          # action above talks to the API and checks nothing out, so without
          # this every `gh` call below aborts on "not a git repository".
          GH_REPO: ${{ github.repository }}
          # The eventual merge must trigger release-please on main.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head release-please--branches--main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "no open release PR — nothing to merge"
            exit 0
          fi
          echo "release PR: #$pr"

          gh pr merge "$pr" --auto --squash --delete-branch

  # release-please first writes the bumped version to its branch. This job runs
  # on that branch push and commits the reference generated from that exact
  # version. Its PAT-authenticated push starts the PR checks again; the second
  # pass has no diff and succeeds without another commit.
  api-docs:
    if: ${{ github.ref == 'refs/heads/release-please--branches--main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs
      - name: Commit the generated API reference
        run: |
          set -euo pipefail
          git add -f docs/api
          if git diff --cached --quiet; then
            echo "API reference is current"
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: generate API reference for $version"
          git push origin HEAD:release-please--branches--main

  # Only the run that cut the Releases publishes — the one the release PR's
  # squash triggered. Every other push to main leaves releases_created unset.
  publish:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The tag, not the triggering push: release-please reads main over the
      # API, so the run that cuts a tag can be checked out at an older commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          # Writes //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} into
          # the runner's npmrc; publishConfig.registry in each package.json
          # names the same host.
          registry-url: https://npm.pkg.github.com
          scope: "@salimhamed"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to GitHub Packages
        env:
          # GITHUB_TOKEN, not the PAT: a publish raises no workflow event this
          # design waits on, and `packages: write` above is exactly the grant.
          # No provenance flag either — attestations exist only on npmjs.
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A version already on the registry is a re-run of this job, not a
          # failure: the registry refuses to publish over it, so skip it.
          # --no-git-checks: the checkout is detached at the squash commit,
          # which pnpm otherwise refuses as "not on a branch".
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — skipping"
          else
            pnpm publish --no-git-checks --access restricted
          fi

      - name: Verify the released version reached the registry
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "jigs-v$version" ]; then
            echo "checked out $version but release-please tagged '$TAG'" >&2
            exit 1
          fi
          npm view "$name@$version" version
