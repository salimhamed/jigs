name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Keep builds and deployments together in one queue. A rerun resolves the
# latest release again, so it cannot restore an older version of the site.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Select the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's latest-release endpoint excludes drafts and prereleases.
          # Use it for manual runs and reruns of older release events too.
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          echo "release_id=$(jq -r '.id' <<<"$release")" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$(jq -r '.tag_name' <<<"$release")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that the built release is still latest
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: |
          set -euo pipefail
          latest_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')"
          if [ "$latest_id" = "$BUILT_RELEASE_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer stable release exists; skipping this deployment."
          fi
      - name: Deploy to GitHub Pages
        if: ${{ steps.current.outputs.deploy == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
