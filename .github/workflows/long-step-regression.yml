name: Long step regression

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit, branch, or tag to test (the workflow file runs from the default branch)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  long-step:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER jigs WITH SUPERUSER PASSWORD 'jigs'" -c "CREATE DATABASE jigs OWNER jigs"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `jigs init` and `jigs build` run from the CLI's dist, so the CLI has to
      # exist as the built artifact the way it does in the normal step-ids job.
      - name: Build jigs
        run: pnpm build

      # The built service loads both CLIs during startup. No login is needed;
      # the check only runs their version probes inside the compiled factory.
      - name: Install workflow CLI peers
        run: npm install --global @anthropic-ai/claude-code @openai/codex

      - name: Record test provenance
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          commit="$(git rev-parse HEAD)"
          sdk_versions="$(node -e 'for (const name of ["workflow", "@workflow/world-postgres", "@workflow/web"]) console.log(`${name}@${require(`./packages/jigs/node_modules/${name}/package.json`).version}`)')"
          printf 'checked-out commit: %s\n%s\n' "$commit" "$sdk_versions"
          {
            echo '## Long step regression provenance'
            printf '%s\n' "- Requested revision: \`$REQUESTED_REVISION\`"
            echo "- Checked-out commit: \`$commit\`"
            echo '- Installed Workflow SDK packages:'
            while IFS= read -r version; do
              echo "  - \`$version\`"
            done <<< "$sdk_versions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the five-minute compiled-runtime regression
        env:
          JIGS_E2E_LONG_STEP_MS: 301000
          WORKFLOW_POSTGRES_URL: postgres://jigs:jigs@localhost:5432/jigs
        run: pnpm e2e

      - name: Preserve failure diagnostics
        if: ${{ failure() }}
        run: |
          git status --short
          git log -1 --oneline --decorate
          pnpm --filter @jigs-ai/jigs list --depth 0 --json
