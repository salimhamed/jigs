# The Postgres the *.live.test.ts files in this package run against. Named
# apart from any factory's own World so the two never share a container or a
# volume: docker compose -f test/docker-compose.yml up -d --wait
name: jigs-service-tests
services:
  postgres:
    image: postgres:17-alpine
    container_name: jigs-service-tests-postgres
    environment:
      POSTGRES_USER: jigs
      POSTGRES_PASSWORD: jigs
      POSTGRES_DB: jigs
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jigs -d jigs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
