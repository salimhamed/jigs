packages:
  - packages/*
  - tools/api-docs

allowBuilds:
  '@swc/core': true
  cbor-extract: true
  esbuild: true
# jigs runs the `codex` on PATH, so the provider's optional copy is 320 MB
# that would never run.
ignoredOptionalDependencies:
  - '@openai/codex'

overrides:
  'vite@5>esbuild': 0.25.12
# Workspace packages hoisted into the virtual store resolve from any directory
# on a test's NODE_PATH, so a scratch factory would find @jigs-ai/jigs without
# installing it.
hoistWorkspacePackages: false
